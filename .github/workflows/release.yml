name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
          const pkg = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (pkg.version !== tag) {
            console.error('package.json version ' + pkg.version + ' does not match tag ' + process.env.GITHUB_REF_NAME);
            process.exit(1);
          }
          console.log('version ' + pkg.version + ' matches ' + process.env.GITHUB_REF_NAME);
          "

      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/client.js

      - name: Pack the plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz
          body: |
            Install into DeepSeek Harness:

            ```powershell
            dsh plugin add <path-to-the-tgz>   # or: dsh plugin add https://github.com/${{ github.repository }}
            ```

            Requires `pi` and `pi-acp` on PATH (`npm i -g @earendil-works/pi-coding-agent pi-acp`).
